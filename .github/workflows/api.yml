name: API

on:
  push:
    branches: [main]
    paths: ["api/**", "contracts/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", "contracts/**", ".github/workflows/api.yml"]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

env:
  ENV: test
  SECRET_KEY: ci-secret-key-not-used-elsewhere
  DATABASE_URL: postgres://omeo:omeo@localhost:5432/omeo
  REDIS_URL: redis://localhost:6379/0
  S3_ACCESS_KEY_ID: ci
  S3_SECRET_ACCESS_KEY: ci-secret
  S3_ENDPOINT_URL: http://localhost:9000
  FIELD_ENCRYPTION_KEYS: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: omeo, POSTGRES_PASSWORD: omeo, POSTGRES_DB: omeo }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U omeo" --health-interval 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run
      - name: Tests et couverture
        run: pytest --cov --cov-report=term-missing
      - name: Schéma généré
        run: python manage.py spectacular --file /tmp/generated.yaml --validate
      - uses: actions/upload-artifact@v4
        with: { name: generated-schema, path: /tmp/generated.yaml }

  contract:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: generated-schema, path: /tmp }
      - name: oasdiff (changements incompatibles avec le contrat)
        uses: oasdiff/oasdiff-action/breaking@v0.0.21
        with:
          base: contracts/openapi.yaml
          revision: /tmp/generated.yaml
          fail-on: ERR

  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: api, target: prod, push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
