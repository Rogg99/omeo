# Stack de développement Nyam (tout sauf le mobile).
# Point d'entrée unique : nginx sur http://localhost (voir docker/nginx/dev.conf)

x-api: &api
  build:
    context: ./api
    target: dev
  env_file: ./api/.env
  environment:
    DATABASE_URL: postgres://nyam:nyam@db:5432/nyam
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./api:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

x-next: &next
  environment:
    API_URL_INTERNAL: http://api:8000

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, admin, web]

  api:
    <<: *api

  worker:
    <<: *api
    command: celery -A config worker -l info

  beat:
    <<: *api
    command: celery -A config beat -l info

  admin:
    <<: *next
    build:
      context: ./admin
      dockerfile: ../docker/next.Dockerfile
      target: dev
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next

  web:
    <<: *next
    build:
      context: ./web
      dockerfile: ../docker/next.Dockerfile
      target: dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nyam
      POSTGRES_PASSWORD: nyam
      POSTGRES_DB: nyam
    ports:
      - "5432:5432"  # accès depuis un client SQL sur l'hôte
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyam"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7

volumes:
  pgdata:
