# Stack de développement Omeo (tout sauf le mobile).
# Point d'entrée unique : nginx sur http://localhost (voir docker/nginx/dev.conf)

x-api: &api
  build:
    context: ./api
    target: dev
  env_file: ./api/.env
  environment:
    DATABASE_URL: postgres://omeo:omeo@db:5432/omeo
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./api:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
    minio-init:
      condition: service_completed_successfully

x-next: &next
  environment:
    API_URL_INTERNAL: http://api:8000

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, admin, web, minio]

  api:
    <<: *api

  worker:
    <<: *api
    command: celery -A config worker -l info

  beat:
    <<: *api
    command: celery -A config beat -l info

  admin:
    <<: *next
    build:
      context: ./admin
      dockerfile: ../docker/next.Dockerfile
      target: dev
    volumes:
      - ./admin:/app
      - /app/node_modules
      - /app/.next

  web:
    <<: *next
    build:
      context: ./web
      dockerfile: ../docker/next.Dockerfile
      target: dev
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: omeo
      POSTGRES_PASSWORD: omeo
      POSTGRES_DB: omeo
    ports:
      - "5432:5432"  # accès depuis un client SQL sur l'hôte
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omeo"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7

  # Stockage objet compatible S3 (photos de repas, avatars, médias des contenus, exports).
  # API S3 : http://s3.localhost ; console : http://s3-console.localhost (identifiants ci-dessous, dev uniquement)
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: omeo
      MINIO_ROOT_PASSWORD: omeo-dev-secret
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 10

  # Crée les buckets au démarrage (idempotent) puis s'arrête
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: omeo
      MINIO_ROOT_PASSWORD: omeo-dev-secret
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./docker/minio/init.sh:/init.sh:ro

volumes:
  pgdata:
  miniodata:
