      x-access-note: "Blocs filtrés par permission : dashboard.finance (revenus, MRR, conversion, coût IA), dashboard.support."
      summary: Indicateurs (inscriptions, actifs, rétention, conversion, revenus par canal, IA, avis, support)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: country, in: query, schema: { type: string } }
        - { name: locale, in: query, schema: { $ref: "#/components/schemas/Locale" } }
