          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMember" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/dashboard:
    get:
      tags: [admin-dashboard]
      operationId: adminDashboard
