        title: { $ref: "#/components/schemas/I18nText" }
        body: { $ref: "#/components/schemas/I18nText" }
        deeplink: { type: [string, "null"] }
        image_upload_id: { type: [string, "null"], format: uuid }
        segment: { $ref: "#/components/schemas/Segment" }
        scheduled_at: { type: [string, "null"], format: date-time }
    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignInput"
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, scheduled, sending, sent, canceled] }
            audience_count: { type: integer }
            sent_count: { type: integer }
            opened_count: { type: integer }
            open_rate: { type: [number, "null"] }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
    Settings:
      type: object
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, writeOnly: true, description: "Motif (obligatoire en écriture, audité)" }
        four_eyes:
          type: object
          description: "Désactivation temporaire par domaine (équipe < 2 personnes) — superadmin, step-up, alerte au tableau de bord"
          properties:
            content: { type: boolean }
            finance: { type: boolean }
            settings: { type: boolean }
        billing:
          type: object
          properties:
            refund_approval_threshold_usd: { type: number, default: 50 }
        nutrition:
          type: object
          properties:
            activity_factor: { type: number }
            lose_weight_deficit: { type: number, description: "0.15 à 0.20" }
            gain_muscle_surplus: { type: number }
            min_kcal: { type: object, properties: { female: { type: integer }, male: { type: integer } } }
            protein_g_per_kg: { type: object, additionalProperties: { type: number } }
            fat_ratio: { type: object, additionalProperties: { type: number } }
            water_ml_per_kg: { type: number }
            water_ml_per_active_hour: { type: integer }
            fiber_g: { type: object, properties: { female: { type: integer }, male: { type: integer } } }
            salt_max_g: { type: number }
            activity_bonus_ratio: { type: number, description: "0.5 = moitié de l'excédent" }
            kcal_target_tolerance: { type: number, description: "0.10" }
        ai:
          type: object
          properties:
            vision_model: { type: string }
            text_model: { type: string }
            translation_model: { type: string }
            prompt_version: { type: string }
            system_prompt: { type: string }
            low_confidence_threshold: { type: number }
            monthly_budget_usd: { type: number }
        app:
          type: object
          properties:
            min_version_android: { type: string }
            min_version_ios: { type: string }
            min_age: { type: integer }
            active_locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
            features: { type: object, additionalProperties: { type: boolean } }
            web_checkout_countries: { type: array, items: { type: string } }
        trial:
          type: object
          properties:
            default_days: { type: integer }
            invite_days: { type: integer }
        referral:
          type: object
          properties:
            days_per_referral: { type: integer }
            cap_days: { type: integer }
        challenges:
          type: object
          properties:
            default_success_threshold: { type: number }
        notifications:
          type: object
          properties:
            max_push_per_day: { type: integer }
            default_quiet_start: { type: string }
            default_quiet_end: { type: string }
    ApprovalRequest:
      type: object
      required: [id, kind, domain, status, summary, requested_by, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [content_publish, campaign_schedule, plan_update, quota_update, refund, settings_nutrition] }
        domain: { type: string, enum: [content, finance, settings] }
        status: { type: string, enum: [pending, approved, rejected, expired, canceled] }
        summary: { type: string, description: "Résumé lisible de l'action demandée" }
        target_type: { type: string }
        target_id: { type: string }
        diff: { type: object, additionalProperties: true, description: "Avant / après proposés" }
        reason: { type: [string, "null"] }
        requested_by: { type: string }
        decided_by: { type: [string, "null"] }
        decision_comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        expires_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, action, created_at]
      properties:
        id: { type: string, format: uuid }
        actor: { type: [string, "null"] }
        action: { type: string }
        target_type: { type: string }
        target_id: { type: string }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        ip: { type: string }
        created_at: { type: string, format: date-time }
