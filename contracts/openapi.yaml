        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Ordering" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/AdminContentRow" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin-content]
      operationId: adminCreateContent
      x-permission: content.edit
      summary: Crée un contenu en brouillon
      parameters: [{ $ref: "#/components/parameters/ContentType" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminContentPayload" }
      responses:
        "201":
          description: Créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /admin/content/{type}/{id}:
    get:
      tags: [admin-content]
      operationId: adminGetContent
      summary: Détail d'un contenu
      x-permission: content.view
      parameters: [{ $ref: "#/components/parameters/ContentType" }, { $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin-content]
      operationId: adminUpdateContent
      x-permission: content.edit
      summary: Modifie (verrou optimiste via `version`)
      parameters: [{ $ref: "#/components/parameters/ContentType" }, { $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminContentPayload" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentItem" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [admin-content]
      operationId: adminDeleteContent
      x-permission: content.edit
      summary: Supprime un brouillon jamais publié (sinon archiver)
      parameters: [{ $ref: "#/components/parameters/ContentType" }, { $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Supprimé }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/content/{type}/{id}/transition:
    post:
      tags: [admin-content]
      operationId: adminTransitionContent
      x-permission: content.edit
      x-access-note: "Vers `published` : content.publish (contenu d'une autre personne) ; l'auteur ne peut pas publier son propre contenu (403 self_approval_forbidden) sauf content.publish_own avec `comment` obligatoire."
      summary: brouillon → relecture → publié → archivé
      parameters: [{ $ref: "#/components/parameters/ContentType" }, { $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { $ref: "#/components/schemas/ContentStatus" }
                comment: { type: string, maxLength: 500 }
      responses:
        "202":
          description: Validation par une autre personne requise (ApprovalRequest créée)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentItem" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/content/{type}/{id}/revisions:
    get:
      tags: [admin-content]
      operationId: adminListRevisions
      summary: Historique des versions d'un contenu
      x-permission: content.view
      parameters: [{ $ref: "#/components/parameters/ContentType" }, { $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, author, created_at]
                  properties:
                    id: { type: string, format: uuid }
                    author: { type: string }
                    created_at: { type: string, format: date-time }
                    snapshot: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/content/{type}/{id}/translate:
    post:
      tags: [admin-content]
      operationId: adminMachineTranslate
      x-permission: content.translate
      summary: Propose une traduction IA des champs manquants (à relire, non publiée)
      parameters: [{ $ref: "#/components/parameters/ContentType" }, { $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locales]
              properties:
                locales: { type: array, items: { $ref: "#/components/schemas/Locale" }, minItems: 1 }
      responses:
        "200":
          description: Champs proposés
          content:
            application/json:
              schema: { type: object, additionalProperties: { $ref: "#/components/schemas/I18nText" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /admin/translations:
    get:
      tags: [admin-content]
      operationId: adminTranslationCoverage
      x-permission: content.view
      summary: Couverture des traductions par type de contenu et langue
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [type, locale, total, missing]
                  properties:
                    type: { $ref: "#/components/schemas/ContentTypeName" }
                    locale: { $ref: "#/components/schemas/Locale" }
                    total: { type: integer }
                    missing: { type: integer }
                    percent: { type: number }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/media:
    post:
