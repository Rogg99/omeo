openapi: 3.1.0
info:
  title: Omeo API
  version: 1.1.2
  summary: API unique d'Omeo (mobile, admin, site web).
  license:
    name: Propriétaire, tous droits réservés
    identifier: LicenseRef-Omeo-Proprietary
  description: |
    Contrat cible, écrit avant le code. Conventions : docs/technique/conventions-api.md.
    Modèle de données : docs/technique/modele-donnees.md.

    Règle absolue : l'API fait tous les calculs. Les réponses de lecture sont prêtes à afficher.
    Contrôle d'accès (docs/technique/controle-acces.md) :
    - `x-permission` : permission atomique requise (/admin/*). Les rôles ne sont que des regroupements.
    - `x-step-up` : TOTP de moins de 15 min requis, sinon 401 `step_up_required`.
    - `x-four-eyes` : l'action crée une ApprovalRequest (202) à valider par une autre personne.
    - `x-entitlement` / `x-quota` : droit Plus (403 `plan_required`) ou quota (429 `quota_exceeded`).
    - `x-email-verified` : email vérifié requis (403 `email_not_verified`).
servers:
  - url: http://api.localhost/api/v1
    description: Développement (nginx)
  - url: https://api.omeo.app/api/v1
    description: Production
security:
  - bearer: []
tags:
  - { name: app, description: "Configuration publique" }
  - { name: auth, description: "Authentification et sessions" }
  - { name: account, description: "Compte, profil, consentements, données" }
  - { name: home, description: "Accueil et journal du jour" }
  - { name: meals, description: "Repas, analyses IA, avis" }
  - { name: catalog, description: "Aliments et plats" }
  - { name: tracking, description: "Hydratation, progression, poids" }
  - { name: activity, description: "Santé, activités, balance, analyses croisées" }
  - { name: training, description: "Exercices et séances guidées" }
  - { name: programs, description: "Programmes" }
  - { name: challenges, description: "Challenges" }
  - { name: rewards, description: "Points, niveaux, badges, séries" }
  - { name: content, description: "Recettes, plantes, prévention, FAQ, légal" }
  - { name: billing, description: "Offres, abonnements, paiements, parrainage" }
  - { name: notifications, description: "Push et centre de notifications" }
  - { name: support, description: "Demandes de support" }
  - { name: webhooks, description: "Notifications des stores et de l'agrégateur" }
  - { name: admin-dashboard, description: "Admin : tableau de bord" }
  - { name: admin-users, description: "Admin : utilisateurs" }
  - { name: admin-content, description: "Admin : contenus et traductions" }
  - { name: admin-feedback, description: "Admin : avis sur les analyses" }
  - { name: admin-billing, description: "Admin : offres, quotas, abonnements, paiements, codes promo" }
  - { name: admin-support, description: "Admin : demandes au support" }
  - { name: admin-campaigns, description: "Admin : campagnes de notifications" }
  - { name: admin-settings, description: "Admin : réglages de l'application" }
  - { name: admin-team, description: "Admin : équipe, rôles et journal d'audit" }
paths:
  # ───────────────────────────── APP ─────────────────────────────
  /app/config:
    get:
      tags: [app]
      operationId: getAppConfig
      summary: Configuration publique (version minimale, langues, features, villes suggérées)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /app/cities:
    get:
      tags: [app]
      operationId: searchCities
      summary: Suggestions de villes (onboarding, profil)
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/City" } }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ───────────────────────────── AUTH ─────────────────────────────
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Inscription par email (fin de l'onboarding, étape 9)
      description: |
        Crée le compte, le profil (réponses 1 à 8), les consentements, l'essai (3 j ou 7 j avec code valide)
        et les objectifs. Un code d'invitation invalide ne bloque pas : `invite_code_status` le signale.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Connexion par email et mot de passe
      description: Pour un compte staff, renvoie 401 `mfa_required` avec `meta.mfa_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Connecté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/social:
    post:
      tags: [auth]
      operationId: socialAuth
      summary: Connexion ou inscription avec Google ou Apple
      description: |
        Vérifie l'`id_token` auprès du fournisseur. Si le compte n'existe pas, `profile` et `consents` sont obligatoires
        (sinon 400 `validation_error`). `created` indique s'il s'agit d'une inscription.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialAuthRequest" }
      responses:
        "200":
          description: Connecté ou inscrit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/mfa/verify:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Second facteur (TOTP ou code de secours) pour les comptes staff
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, pattern: "^[0-9A-Za-z-]{6,12}$" }
      responses:
        "200":
          description: Connecté
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/mfa/step-up:
    post:
      tags: [auth]
      operationId: stepUpMfa
      summary: Revalide le TOTP de la session staff (actions sensibles, valable 15 min)
      x-permission: authenticated_staff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^[0-9A-Za-z-]{6,12}$" }
      responses:
        "200":
          description: Session revalidée
          content:
            application/json:
              schema:
                type: object
                required: [mfa_verified_until]
                properties:
                  mfa_verified_until: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotation du jeton de rafraîchissement
      description: Rejouer un refresh déjà utilisé révoque toute la session (détection de vol).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh]
              properties:
                refresh: { type: string }
      responses:
        "200":
          description: Nouveaux jetons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Déconnexion de l'appareil courant (ou de tous)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean, default: false }
      responses:
        "204": { description: Déconnecté }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Envoie un lien de réinitialisation
      description: Répond toujours 204, que l'email existe ou non (pas d'énumération).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "204": { description: Traité }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Définit un nouveau mot de passe à partir du lien reçu
      description: Révoque toutes les sessions existantes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { $ref: "#/components/schemas/Password" }
      responses:
        "204": { description: Mot de passe changé }
        "400": { $ref: "#/components/responses/ValidationError" }
  /auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Vérifie l'adresse email avec le code reçu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Email vérifié }
        "400": { $ref: "#/components/responses/ValidationError" }
  /auth/email/resend:
    post:
      tags: [auth]
      operationId: resendVerificationEmail
      summary: Renvoie l'email de vérification
      responses:
        "204": { description: Envoyé }
        "429": { $ref: "#/components/responses/RateLimited" }
  /referral/check:
    post:
      tags: [billing]
      operationId: checkInviteCode
      summary: Vérifie un code d'invitation avant l'inscription
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { $ref: "#/components/schemas/InviteCode" }
      responses:
        "200":
          description: Résultat
          content:
            application/json:
              schema:
                type: object
                required: [valid, trial_days]
                properties:
                  valid: { type: boolean }
                  referrer_first_name: { type: [string, "null"], description: "Pour « Awa t'invite »" }
                  trial_days: { type: integer, examples: [7] }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ───────────────────────────── ACCOUNT ─────────────────────────────
  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: Utilisateur, profil, objectifs, droits et préférences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [account]
      operationId: requestAccountDeletion
      summary: Demande de suppression du compte (purge à J+30)
      description: Révoque les sessions. Réponse indique si un abonnement store reste à résilier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, const: DELETE }
                password: { type: string, description: "Requis si le compte a un mot de passe" }
                reason: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Suppression programmée
          content:
            application/json:
              schema:
                type: object
                required: [scheduled_for, store_subscription_active]
                properties:
                  scheduled_for: { type: string, format: date-time }
                  store_subscription_active: { type: boolean }
                  store_channel: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/profile:
    patch:
      tags: [account]
      operationId: updateProfile
      summary: Modifie le profil (recalcule les objectifs si nécessaire)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Profil et objectifs à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /me/avatar:
    put:
      tags: [account]
      operationId: setAvatar
      summary: Définit la photo de profil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Image" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [account]
      operationId: deleteAvatar
      summary: Supprime la photo de profil
      responses:
        "204": { description: Supprimé }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/email:
    post:
      tags: [account]
      operationId: changeEmail
      x-email-verified: true
      summary: Change l'email (lien de confirmation envoyé à la nouvelle adresse)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "202": { description: Confirmation envoyée }
        "400": { $ref: "#/components/responses/ValidationError" }
  /me/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Change ou définit le mot de passe (révoque les autres sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                current_password: { type: string, description: "Absent si compte social sans mot de passe" }
                new_password: { $ref: "#/components/schemas/Password" }
      responses:
        "204": { description: Changé }
        "400": { $ref: "#/components/responses/ValidationError" }
  /me/social-accounts:
    get:
      tags: [account]
      operationId: listSocialAccounts
      summary: Comptes Google et Apple liés
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [provider, email]
                  properties:
                    provider: { type: string, enum: [google, apple] }
                    email: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions:
    get:
      tags: [account]
      operationId: listSessions
      summary: Appareils connectés
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Session" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/sessions/{id}:
    delete:
      tags: [account]
      operationId: revokeSession
      summary: Révoque une session
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Révoquée }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/consents:
    get:
      tags: [account]
      operationId: listConsents
      summary: État actuel des consentements et documents à (ré)accepter
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [consents, pending_documents]
                properties:
                  consents: { type: array, items: { $ref: "#/components/schemas/ConsentState" } }
                  pending_documents: { type: array, items: { $ref: "#/components/schemas/LegalDocumentRef" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [account]
      operationId: updateConsents
      summary: Accepte ou retire des consentements (ajout seul côté serveur)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consents]
              properties:
                consents: { type: array, items: { $ref: "#/components/schemas/ConsentInput" }, minItems: 1 }
      responses:
        "200":
          description: État à jour
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/exports:
    post:
      tags: [account]
      operationId: requestDataExport
      x-email-verified: true
      summary: Demande un export de toutes ses données (lien envoyé par email et notification)
      responses:
        "202":
          description: Export en préparation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [account]
      operationId: listDataExports
      summary: Exports de données demandés
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DataExport" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/uploads:
    post:
      tags: [account]
      operationId: createUpload
      summary: Obtient une URL présignée pour téléverser un fichier directement vers le stockage
      description: |
        Le client PUT le fichier sur `upload_url` avec les en-têtes fournis, puis référence `id`.
        L'API vérifie type réel, taille (≤ 8 Mo) et retire les métadonnées EXIF.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, content_type, size]
              properties:
                kind: { type: string, enum: [meal_photo, avatar, support_attachment] }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic] }
                size: { type: integer, minimum: 1, maximum: 8388608 }
      responses:
        "201":
          description: URL présignée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /account-deletion:
    post:
      tags: [account]
      operationId: requestDeletionByEmail
      summary: Demande publique de suppression (page web exigée par Google Play)
      description: Envoie un lien de confirmation si le compte existe. Répond toujours 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captcha]
              properties:
                email: { type: string, format: email }
                captcha: { type: string, description: Jeton Cloudflare Turnstile }
      responses:
        "204": { description: Traité }
        "429": { $ref: "#/components/responses/RateLimited" }
  /account-deletion/confirm:
    post:
      tags: [account]
      operationId: confirmDeletionByEmail
      summary: Confirme la suppression du compte depuis le lien reçu par email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Suppression programmée }
        "400": { $ref: "#/components/responses/ValidationError" }
  # ───────────────────────────── HOME / JOURNAL ─────────────────────────────
  /me/home:
    get:
      tags: [home]
      operationId: getHome
      summary: Écran d'accueil complet en un seul appel
      parameters: [{ $ref: "#/components/parameters/DateOptional" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Home" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/days/{date}:
    get:
      tags: [home]
      operationId: getDay
      summary: Journal d'un jour (objectif, résumé, 4 repas, hydratation, message)
      parameters: [{ $ref: "#/components/parameters/DatePath" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DayDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/calendar:
    get:
      tags: [home]
      operationId: getCalendar
      summary: État de chaque jour d'un mois (pour le calendrier du journal)
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [date, status]
                  properties:
                    date: { type: string, format: date }
                    status: { type: string, enum: [empty, partial, on_target, over, under] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── MEALS ─────────────────────────────
  /me/analyses:
    post:
      tags: [meals]
      operationId: createAnalysis
      x-entitlement: { feature: text_analysis, when: "kind = text" }
      x-quota: photo_analysis | text_analysis
      summary: Lance une analyse IA (photo ou texte)
      description: |
        Décompte le quota dans la même transaction (remboursé si l'analyse échoue).
        Texte libre / vocal = Plus uniquement (403 `plan_required`). Saisie vocale transcrite sur l'appareil.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/PhotoAnalysisInput" }
                - { $ref: "#/components/schemas/TextAnalysisInput" }
              discriminator:
                propertyName: kind
                mapping:
                  photo: "#/components/schemas/PhotoAnalysisInput"
                  text: "#/components/schemas/TextAnalysisInput"
      responses:
        "202":
          description: Analyse en file
          headers:
            Retry-After: { schema: { type: integer }, description: Secondes avant le prochain poll }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /me/analyses/{id}:
    get:
      tags: [meals]
      operationId: getAnalysis
      summary: État et résultat d'une analyse
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK (status queued|processing|succeeded|failed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/analyses/{id}/dish:
    post:
      tags: [meals]
      operationId: selectAnalysisDish
      summary: Remplace le plat détecté par un plat du catalogue (« Pas satisfait ? »)
      description: |
        Le plat vient d'une alternative de l'analyse ou de la recherche de plats. L'API recharge sa
        composition type, recalcule `items` et `totals`, et enregistre l'avis `wrong_dish`.
        Aucun appel à l'IA, aucun décompte de quota.
        409 `conflict` si l'analyse n'est pas `succeeded` ou est déjà liée à un repas.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dish_id]
              properties:
                dish_id: { type: string, format: uuid }
      responses:
        "200":
          description: Analyse mise à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/analyses/{id}/feedback:
    put:
      tags: [meals]
      operationId: putAnalysisFeedback
      summary: Avis 👍/👎 sur une analyse (crée ou remplace)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "200":
          description: Enregistré (points éventuels)
          content:
            application/json:
              schema:
                type: object
                required: [rewards]
                properties:
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/quotas:
    get:
      tags: [meals]
      operationId: getQuotas
      summary: Quotas restants (affichés avant chaque photo)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Quota" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/meals:
    get:
      tags: [meals]
      operationId: listMeals
      summary: Repas d'un jour ou d'une période
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/Meal" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [meals]
      operationId: createMeal
      summary: Enregistre un repas (depuis une analyse, un plat, une recette, ou des aliments)
      description: Les valeurs nutritionnelles sont calculées depuis la base d'aliments, jamais depuis l'IA.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealInput" }
      responses:
        "201":
          description: Repas créé, jour recalculé, récompenses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealWriteResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/meals/{id}:
    get:
      tags: [meals]
      operationId: getMeal
      summary: Détail d'un repas
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meal" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [meals]
      operationId: updateMeal
      summary: Modifie les aliments, le type de repas, ou déplace vers un autre jour
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MealUpdate" }
      responses:
        "200":
          description: Repas et jour(s) recalculés
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealWriteResult" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [meals]
      operationId: deleteMeal
      summary: Supprime un repas
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Supprimé, jour recalculé
          content:
            application/json:
              schema:
                type: object
                required: [day]
                properties:
                  day: { $ref: "#/components/schemas/DaySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/meals/{id}/duplicate:
    post:
      tags: [meals]
      operationId: duplicateMeal
      summary: Duplique un repas
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, meal_type]
              properties:
                date: { type: string, format: date }
                meal_type: { $ref: "#/components/schemas/MealType" }
      responses:
        "201":
          description: Copie créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealWriteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/meals/{id}/photo:
    delete:
      tags: [meals]
      operationId: deleteMealPhoto
      summary: Supprime la photo d'un repas
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Photo supprimée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/meal-type-suggestion:
    get:
      tags: [meals]
      operationId: suggestMealType
      summary: Type de repas proposé selon l'heure locale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [meal_type, date]
                properties:
                  meal_type: { $ref: "#/components/schemas/MealType" }
                  date: { type: string, format: date }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── CATALOG ─────────────────────────────
  /foods:
    get:
      tags: [catalog]
      operationId: searchFoods
      summary: Recherche d'aliments (ajout d'ingrédient), noms locaux inclus
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 60 } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/FoodSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dishes:
    get:
      tags: [catalog]
      operationId: searchDishes
      summary: Recherche dans le catalogue de plats
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, recent, favorites], default: all } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/DishSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /dishes/{id}:
    get:
      tags: [catalog]
      operationId: getDish
      summary: Détail d'un plat
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DishDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /dishes/{id}/favorite:
    put:
      tags: [catalog]
      operationId: favoriteDish
      summary: Ajoute un plat aux favoris
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Ajouté }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [catalog]
      operationId: unfavoriteDish
      summary: Retire un plat des favoris
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Retiré }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── TRACKING ─────────────────────────────
  /me/water:
    post:
      tags: [tracking]
      operationId: addWater
      summary: Ajoute de l'eau (verre 250 ml, bouteille 500 ml, ou libre). Valeur négative = annulation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_ml]
              properties:
                amount_ml: { type: integer, minimum: -2000, maximum: 3000, not: { const: 0 } }
                date: { type: string, format: date, description: "Défaut : aujourd'hui (local)" }
      responses:
        "201":
          description: Hydratation à jour
          content:
            application/json:
              schema:
                type: object
                required: [water, rewards]
                properties:
                  water: { $ref: "#/components/schemas/Water" }
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/progress:
    get:
      tags: [tracking]
      operationId: getProgress
      x-entitlement: { feature: progress_long_range, when: "range != 7d" }
      summary: Courbe d'un nutriment (7 j en Free ; 30 j, 90 j, 1 an en Plus)
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [kcal, carbs, fat, protein, fiber, salt] }
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, 90d, 1y], default: 7d }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/weights:
    get:
      tags: [tracking]
      operationId: getWeights
      summary: Courbe du poids, cible, écart, tendance
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: [30d, 90d, 1y, all], default: 90d }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeightOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tracking]
      operationId: addWeight
      summary: Saisie manuelle (l'emporte sur l'import le même jour). Recalcule les objectifs
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weight_kg]
              properties:
                weight_kg: { type: number, minimum: 30, maximum: 300 }
                date: { type: string, format: date }
      responses:
        "201":
          description: Poids enregistré, objectifs recalculés
          content:
            application/json:
              schema:
                type: object
                required: [overview, targets, rewards]
                properties:
                  overview: { $ref: "#/components/schemas/WeightOverview" }
                  targets: { $ref: "#/components/schemas/Targets" }
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/weights/{id}:
    delete:
      tags: [tracking]
      operationId: deleteWeight
      summary: Supprime une pesée
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Supprimé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeightOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  # ───────────────────────────── ACTIVITY ─────────────────────────────
  /me/health/connection:
    put:
      tags: [activity]
      operationId: setHealthConnection
      summary: Déclare la connexion à Health Connect / Apple Health et les types autorisés
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, granted_types]
              properties:
                source: { type: string, enum: [health_connect, apple_health] }
                granted_types:
                  type: array
                  items: { type: string, enum: [steps, distance, active_calories, workouts, weight, heart_rate] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthConnection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [activity]
      operationId: deleteHealthConnection
      summary: Déconnexion (les données déjà importées sont conservées)
      responses:
        "204": { description: Déconnecté }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/health/sync:
    post:
      tags: [activity]
      operationId: syncHealth
      summary: Envoie les totaux par jour, séances et pesées lus sur l'appareil (upsert idempotent)
      description: |
        Le mobile ne lit que les jours modifiés depuis `last_sync_at` (maximum 30 jours en arrière).
        L'API recalcule balance, objectifs, points et challenges des jours concernés.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthSyncInput" }
      responses:
        "200":
          description: Jours recalculés
          content:
            application/json:
              schema:
                type: object
                required: [days, merge_suggestions, rewards, last_sync_at]
                properties:
                  days: { type: array, items: { $ref: "#/components/schemas/DaySummary" } }
                  merge_suggestions: { type: array, items: { $ref: "#/components/schemas/MergeSuggestion" } }
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
                  last_sync_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/activity:
    get:
      tags: [activity]
      operationId: getActivityOverview
      summary: Écran Sport — pas, distance, calories, balance du jour et de la semaine, séances
      parameters: [{ $ref: "#/components/parameters/DateOptional" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/activities:
    get:
      tags: [activity]
      operationId: listActivities
      summary: Activités physiques
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [activity]
      operationId: createActivity
      summary: Saisie manuelle (secours). Calories estimées par l'API
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "201":
          description: Créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityWriteResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
  /me/activities/{id}:
    patch:
      tags: [activity]
      operationId: updateActivity
      summary: Modifie une activité manuelle
      description: Seules les activités manuelles sont modifiables.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityWriteResult" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [activity]
      operationId: deleteActivity
      summary: Supprime une activité
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Supprimée
          content:
            application/json:
              schema:
                type: object
                required: [day]
                properties:
                  day: { $ref: "#/components/schemas/DaySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/activities/{id}/merge:
    post:
      tags: [activity]
      operationId: mergeActivity
      summary: Fusionne une saisie manuelle dans une séance importée qui la recouvre
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [into_id]
              properties:
                into_id: { type: string, format: uuid }
      responses:
        "200":
          description: Fusionnée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityWriteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/insights:
    get:
      tags: [activity]
      operationId: listInsights
      x-entitlement: { feature: insights }
      summary: Analyses croisées nutrition × activité (Plus)
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/Insight" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── TRAINING ─────────────────────────────
  /exercises:
    get:
      tags: [training]
      operationId: listExercises
      summary: Catalogue d'exercices
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: muscle, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: equipment, in: query, schema: { type: string, enum: [none, any] } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (`locked=true` pour le contenu Plus en Free)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/ExerciseSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /exercises/{id}:
    get:
      tags: [training]
      operationId: getExercise
      summary: Détail d'un exercice
      x-entitlement: { feature: full_catalog, when: "contenu non gratuit" }
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /workouts:
    get:
      tags: [training]
      operationId: listWorkouts
      summary: Séances
      parameters:
        - { name: goal, in: query, schema: { type: string, enum: [cardio, strength, mobility] } }
        - { name: level, in: query, schema: { $ref: "#/components/schemas/Level" } }
        - { name: max_minutes, in: query, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/WorkoutSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /workouts/{id}:
    get:
      tags: [training]
      operationId: getWorkout
      x-entitlement: { feature: full_catalog, when: "contenu non gratuit" }
      summary: Séance complète avec ses étapes (vidéos HLS + sous-titres)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /workouts/{id}/download:
    get:
      tags: [training]
      operationId: getWorkoutDownload
      x-entitlement: { feature: offline_workouts }
      summary: URL signées des médias MP4 pour usage hors connexion (Plus)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [files, expires_at]
                properties:
                  expires_at: { type: string, format: date-time }
                  files:
                    type: array
                    items:
                      type: object
                      required: [exercise_id, url, size]
                      properties:
                        exercise_id: { type: string, format: uuid }
                        url: { type: string, format: uri }
                        size: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
  /me/workout-sessions:
    post:
      tags: [training]
      operationId: completeWorkoutSession
      summary: Enregistre une séance terminée (ou partielle). Calories et points calculés par l'API
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workout_id, started_at, ended_at, completed_steps]
              properties:
                workout_id: { type: string, format: uuid }
                started_at: { type: string, format: date-time }
                ended_at: { type: string, format: date-time }
                completed_steps: { type: integer, minimum: 0 }
      responses:
        "201":
          description: Récapitulatif
          content:
            application/json:
              schema:
                type: object
                required: [id, kcal, duration_s, completed, day, rewards]
                properties:
                  id: { type: string, format: uuid }
                  kcal: { type: integer }
                  duration_s: { type: integer }
                  completed: { type: boolean }
                  day: { $ref: "#/components/schemas/DaySummary" }
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ───────────────────────────── PROGRAMS ─────────────────────────────
  /programs:
    get:
      tags: [programs]
      operationId: listPrograms
      summary: Programmes
      parameters:
        - { name: goal, in: query, schema: { $ref: "#/components/schemas/Goal" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProgramSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /programs/{id}:
    get:
      tags: [programs]
      operationId: getProgram
      summary: Détail d'un programme
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgramDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /programs/{id}/enroll:
    post:
      tags: [programs]
      operationId: enrollProgram
      x-entitlement: { feature: programs }
      summary: Commence un programme (Plus). `replace=true` requis si un autre est actif
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                replace: { type: boolean, default: false }
      responses:
        "201":
          description: Inscrit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/program:
    get:
      tags: [programs]
      operationId: getActiveProgram
      summary: Programme actif — jour courant, semaine, avancement
      parameters: [{ $ref: "#/components/parameters/DateOptional" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enrollment" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [programs]
      operationId: quitProgram
      summary: Quitte le programme en cours
      responses:
        "204": { description: Abandonné }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/program/tasks/{id}:
    put:
      tags: [programs]
      operationId: checkProgramTask
      x-entitlement: { feature: programs }
      summary: Coche ou décoche une tâche manuelle du jour
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
                date: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [enrollment, rewards]
                properties:
                  enrollment: { $ref: "#/components/schemas/Enrollment" }
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── CHALLENGES ─────────────────────────────
  /challenges:
    get:
      tags: [challenges]
      operationId: listChallenges
      summary: Challenges
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChallengeSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /challenges/{id}:
    get:
      tags: [challenges]
      operationId: getChallenge
      summary: Détail d'un challenge
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChallengeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /challenges/{id}/join:
    post:
      tags: [challenges]
      operationId: joinChallenge
      x-quota: challenges_active
      summary: "Rejoint un challenge (Free : 1 actif — 429 `quota_exceeded`)"
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participation" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /me/challenges:
    get:
      tags: [challenges]
      operationId: listMyChallenges
      summary: Mes challenges
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, finished] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Participation" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/challenges/{id}:
    get:
      tags: [challenges]
      operationId: getMyChallenge
      summary: Calendrier réussi/raté, série, taux de réussite
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Participation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [challenges]
      operationId: leaveChallenge
      summary: Quitte un challenge
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Abandonné }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/challenges/{id}/days/{date}:
    put:
      tags: [challenges]
      operationId: checkChallengeDay
      summary: Coche un jour (challenges à validation manuelle uniquement, jour courant ou veille)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DatePath" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [participation, rewards]
                properties:
                  participation: { $ref: "#/components/schemas/Participation" }
                  rewards: { $ref: "#/components/schemas/RewardDelta" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── REWARDS ─────────────────────────────
  /me/rewards:
    get:
      tags: [rewards]
      operationId: getRewards
      summary: Écran « Mes récompenses »
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RewardsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/badges:
    get:
      tags: [rewards]
      operationId: listBadges
      summary: Mes badges
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserBadge" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/points:
    get:
      tags: [rewards]
      operationId: listPointEvents
      summary: Historique des points
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/PointEvent" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  # ───────────────────────────── CONTENT ─────────────────────────────
  /recipes:
    get:
      tags: [content]
      operationId: listRecipes
      summary: Recettes
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: goal, in: query, schema: { $ref: "#/components/schemas/Goal" } }
        - { name: tag, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: max_minutes, in: query, schema: { type: integer, minimum: 1 } }
        - { name: favorites, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (`locked=true` pour les recettes Plus en Free)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /recipes/{id}:
    get:
      tags: [content]
      operationId: getRecipe
      summary: Détail d'une recette
      x-entitlement: { feature: full_catalog, when: "contenu non gratuit" }
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /recipes/{id}/favorite:
    put:
      tags: [content]
      operationId: favoriteRecipe
      summary: Ajoute une recette aux favoris
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Ajoutée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [content]
      operationId: unfavoriteRecipe
      summary: Retire une recette des favoris
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Retirée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /plants:
    get:
      tags: [content]
      operationId: listPlants
      summary: Plantes
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 60 } }
        - { name: tag, in: query, schema: { type: string, enum: [traditional_use, nutritional_support, caution] } }
        - { name: favorites, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/PlantSummary" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /plants/{id}:
    get:
      tags: [content]
      operationId: getPlant
      summary: Détail d'une plante
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
  /plants/{id}/favorite:
    put:
      tags: [content]
      operationId: favoritePlant
      summary: Ajoute une plante aux favoris
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Ajoutée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [content]
      operationId: unfavoritePlant
      summary: Retire une plante des favoris
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Retirée }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/prevention:
    get:
      tags: [content]
      operationId: getPrevention
      summary: Conseils déclenchés, état « pas assez de données », bilan hebdo (Plus)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreventionOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/prevention/tips/{id}:
    patch:
      tags: [content]
      operationId: updateUserTip
      summary: Met à jour un conseil de prévention (lu, masqué)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                read: { type: boolean }
                dismissed: { type: boolean }
      responses:
        "204": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /faq:
    get:
      tags: [content]
      operationId: listFaq
      summary: Questions fréquentes
      security: []
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [app, web] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [category, items]
                  properties:
                    category: { type: string }
                    items:
                      type: array
                      items:
                        type: object
                        required: [id, question, answer]
                        properties:
                          id: { type: string, format: uuid }
                          question: { type: string }
                          answer: { type: string, description: Markdown }
        "429": { $ref: "#/components/responses/RateLimited" }
  /legal/{kind}:
    get:
      tags: [content]
      operationId: getLegalDocument
      summary: Dernière version publiée (Markdown)
      security: []
      parameters:
        - { name: kind, in: path, required: true, schema: { $ref: "#/components/schemas/LegalKind" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalDocument" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ───────────────────────────── BILLING ─────────────────────────────
  /billing/plans:
    get:
      tags: [billing]
      operationId: listPlans
      summary: Offres et prix (USD), avantages, quotas par offre — app, site, page Tarifs
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanCatalog" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /me/subscription:
    get:
      tags: [billing]
      operationId: getSubscription
      summary: Droits effectifs, abonnement courant, canal, quotas, actions possibles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/subscription/verify:
    post:
      tags: [billing]
      operationId: verifyStorePurchase
      summary: Vérifie un achat Google Play / App Store auprès du store et l'attache au compte
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/GooglePlayPurchaseInput" }
                - { $ref: "#/components/schemas/AppStorePurchaseInput" }
              discriminator:
                propertyName: channel
                mapping:
                  google_play: "#/components/schemas/GooglePlayPurchaseInput"
                  app_store: "#/components/schemas/AppStorePurchaseInput"
      responses:
        "200":
          description: État à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionState" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/subscription/restore:
    post:
      tags: [billing]
      operationId: restorePurchases
      summary: Restaure les achats du store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, receipts]
              properties:
                channel: { type: string, enum: [google_play, app_store] }
                receipts: { type: array, items: { type: string }, maxItems: 50 }
      responses:
        "200":
          description: État à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/payments:
    get:
      tags: [billing]
      operationId: listPayments
      summary: Mes paiements
      parameters: [{ $ref: "#/components/parameters/Cursor" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/Payment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/billing/checkout:
    post:
      tags: [billing]
      operationId: createWebCheckout
      x-email-verified: true
      summary: Session de paiement web (carte, Apple Pay, Google Pay via l'agrégateur)
      description: Refusé (409) si un abonnement store est actif. Le site redirige vers `checkout_url`.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code, success_url, cancel_url]
              properties:
                plan_code: { type: string, enum: [plus_monthly, plus_annual] }
                promo_code: { type: string, maxLength: 40 }
                success_url: { type: string, format: uri }
                cancel_url: { type: string, format: uri }
      responses:
        "201":
          description: Session créée
          content:
            application/json:
              schema:
                type: object
                required: [checkout_url, expires_at]
                properties:
                  checkout_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/billing/promo-check:
    post:
      tags: [billing]
      operationId: checkPromoCode
      summary: Vérifie un code promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, plan_code]
              properties:
                code: { type: string, maxLength: 40 }
                plan_code: { type: string, enum: [plus_monthly, plus_annual] }
      responses:
        "200":
          description: Prix après remise (calculé par l'API)
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  label: { type: string }
                  original: { $ref: "#/components/schemas/Money" }
                  discounted: { $ref: "#/components/schemas/Money" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/billing/portal:
    post:
      tags: [billing]
      operationId: createBillingPortal
      x-email-verified: true
      summary: Lien vers le portail de l'agrégateur (moyen de paiement, résiliation) — abonnement web
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [return_url]
              properties:
                return_url: { type: string, format: uri }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/referral:
    get:
      tags: [billing]
      operationId: getReferral
      summary: Code, lien de partage, filleuls validés, jours gagnés sur 35
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── NOTIFICATIONS ─────────────────────────────
  /me/devices:
    post:
      tags: [notifications]
      operationId: registerPushDevice
      summary: Enregistre ou met à jour le jeton push de l'appareil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, maxLength: 4096 }
                platform: { type: string, enum: [android, ios] }
                app_version: { type: string, maxLength: 20 }
      responses:
        "204": { description: Enregistré }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/devices/{token}:
    delete:
      tags: [notifications]
      operationId: unregisterPushDevice
      summary: Désenregistre un appareil des notifications push
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Retiré }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/notification-preferences:
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: Préférences de notification
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [notifications]
      operationId: updateNotificationPreferences
      summary: Modifie les préférences de notification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferences" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /me/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: Mes notifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
