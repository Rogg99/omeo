        - { name: target_type, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    DatePath: { name: date, in: path, required: true, schema: { type: string, format: date } }
    DateOptional: { name: date, in: query, description: "Journée locale. Défaut : aujourd'hui", schema: { type: string, format: date } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
    Ordering: { name: ordering, in: query, schema: { type: string, examples: ["-created_at"] } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4. Rejouer la même clé renvoie la réponse d'origine (24 h).
      schema: { type: string, format: uuid }
    ContentType: { name: type, in: path, required: true, schema: { $ref: "#/components/schemas/ContentTypeName" } }

  responses:
    ValidationError:
      description: Données invalides (`validation_error`, détail par champ)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: Non authentifié (`not_authenticated`, `token_expired`, `invalid_credentials`, `mfa_required`)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Interdit (`forbidden`, `forbidden_role`, `plan_required`, `consent_required`, `account_suspended`)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    NotFound:
      description: Introuvable (ou appartient à un autre utilisateur)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Conflict:
      description: Conflit d'état (`conflict`, `already_enrolled`, `idempotency_conflict`)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    QuotaExceeded:
      description: Quota épuisé (`quota_exceeded`, `meta.resets_at`, `meta.upgrade`)
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimited:
      description: Trop de requêtes (`rate_limited`)
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }

  schemas:
    # ───────── Communs
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [code, message]
              properties: { code: { type: string }, message: { type: string } }
        meta: { type: object, additionalProperties: true }
        request_id: { type: string }
    CursorPage:
      type: object
      required: [results, next_cursor]
      properties:
        results: { type: array, items: {} }
        next_cursor: { type: [string, "null"] }
    PageMeta:
      type: object
      required: [results, count, page, page_size]
      properties:
        results: { type: array, items: {} }
        count: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
    Money:
      type: object
      required: [amount_cents, currency]
      properties:
        amount_cents: { type: integer }
        currency: { type: string, const: USD }
        formatted: { type: string, examples: ["$4.49"], description: "Formaté selon Accept-Language" }
    Image:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        width: { type: integer }
        height: { type: integer }
        blurhash: { type: string }
    I18nText:
      type: object
      description: "Admin uniquement. Clés = codes de langue."
      additionalProperties: { type: string }
      propertyNames: { $ref: "#/components/schemas/Locale" }
    Locale: { type: string, enum: [fr, en, es, pt, ar, zh, ja, de] }
    Goal: { type: string, enum: [lose_weight, gain_muscle, eat_balanced, prevent_diabetes, prevent_hypertension] }
    Sex: { type: string, enum: [male, female] }
    Level: { type: string, enum: [beginner, intermediate, advanced] }
    MealType: { type: string, enum: [breakfast, lunch, snack, dinner] }
    PlanTier: { type: string, enum: [trial, free, plus] }
    Channel: { type: string, enum: [google_play, app_store, web, grant] }
    SubscriptionStatus: { type: string, enum: [trial, active, grace, canceled, expired, refunded] }
    LegalKind: { type: string, enum: [terms, privacy, cookies, legal_notice] }
    ConsentKind: { type: string, enum: [terms, privacy, health_data, marketing] }
    ContentStatus: { type: string, enum: [draft, review, published, archived] }
    FeedbackReason: { type: string, enum: [wrong_dish, missing_ingredient, wrong_quantities, other] }
    TicketStatus: { type: string, enum: [new, open, waiting_user, resolved, closed] }
    TicketCategory: { type: string, enum: [question, technical, billing, suggestion, personal_data, account_deletion] }
    StaffRole: { type: string, enum: [superadmin, content, support, finance, moderation] }
    InviteCode: { type: string, pattern: "^[A-Za-z0-9]{4,10}$" }
    Password:
      type: string
      minLength: 10
      maxLength: 128
      description: "≥ 10 caractères, minuscule, majuscule, chiffre, caractère spécial (vérifié par l'API)"
    Nutrients:
      type: object
      required: [kcal, protein_g, carbs_g, fat_g]
      properties:
        kcal: { type: integer }
        protein_g: { type: number }
        carbs_g: { type: number }
        sugars_g: { type: number }
        fat_g: { type: number }
        saturated_fat_g: { type: number }
        fiber_g: { type: number }
        salt_g: { type: number }
    Gauge:
      type: object
      description: Valeur prête à afficher (consommé / objectif)
      required: [value, target, percent]
      properties:
        value: { type: number }
        target: { type: number }
        remaining: { type: number, description: "target - value, borné à 0 côté API" }
        percent: { type: integer, description: "0-100+ (arrondi API)" }
        status: { type: string, enum: [under, on_target, over] }
    RewardDelta:
      type: object
      description: Récompenses gagnées par l'action (pour animation)
      required: [points]
      properties:
        points: { type: integer }
        total_points: { type: integer }
        level_up: { anyOf: [{ $ref: "#/components/schemas/LevelInfo" }, { type: "null" }] }
        badges: { type: array, items: { $ref: "#/components/schemas/BadgeRef" } }
        streak: { type: integer }

    # ───────── App / auth / compte
    AppConfig:
      type: object
      required: [min_version, latest_version, locales, features, quotas_display, legal_versions]
      properties:
        min_version: { type: object, properties: { android: { type: string }, ios: { type: string } } }
        latest_version: { type: object, properties: { android: { type: string }, ios: { type: string } } }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
        features: { type: object, additionalProperties: { type: boolean } }
        web_checkout_countries: { type: array, items: { type: string } }
        min_age: { type: integer }
        trial_days: { type: object, properties: { default: { type: integer }, with_invite: { type: integer } } }
        quotas_display: { type: object, additionalProperties: true }
        legal_versions: { type: object, additionalProperties: { type: integer } }
        support_email: { type: string, format: email }
        store_urls: { type: object, properties: { google_play: { type: string }, app_store: { type: string } } }
    City:
      type: object
      required: [id, name, country]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        timezone: { type: string }
    OnboardingProfile:
      type: object
      required: [first_name, last_name, birth_date, sex, height_cm, weight_kg, target_weight_kg, goals]
      properties:
        first_name: { type: string, minLength: 1, maxLength: 40 }
        last_name: { type: string, minLength: 1, maxLength: 40 }
        birth_date: { type: string, format: date }
        sex: { $ref: "#/components/schemas/Sex" }
        city_id: { type: string, format: uuid }
        city_label: { type: string, maxLength: 80 }
        height_cm: { type: number, minimum: 100, maximum: 250 }
        weight_kg: { type: number, minimum: 30, maximum: 300 }
        target_weight_kg: { type: number, minimum: 30, maximum: 300 }
        goals: { type: array, items: { $ref: "#/components/schemas/Goal" }, minItems: 1, uniqueItems: true }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
    ConsentInput:
      type: object
      required: [kind, granted]
      properties:
        kind: { $ref: "#/components/schemas/ConsentKind" }
        granted: { type: boolean }
        version: { type: integer, description: "Version du document acceptée" }
    DeviceInfo:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        platform: { type: string, enum: [android, ios, web, admin] }
        app_version: { type: string, maxLength: 20 }
        fingerprint: { type: string, maxLength: 128, description: "Empreinte hachée (anti-fraude parrainage)" }
    RegisterRequest:
      type: object
      required: [email, password, profile, consents]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: "#/components/schemas/Password" }
        invite_code: { $ref: "#/components/schemas/InviteCode" }
        profile: { $ref: "#/components/schemas/OnboardingProfile" }
        consents: { type: array, items: { $ref: "#/components/schemas/ConsentInput" }, minItems: 2 }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    SocialAuthRequest:
      type: object
      required: [provider, id_token]
      properties:
        provider: { type: string, enum: [google, apple] }
        id_token: { type: string }
        nonce: { type: string, description: Apple }
        invite_code: { $ref: "#/components/schemas/InviteCode" }
        profile: { $ref: "#/components/schemas/OnboardingProfile" }
        consents: { type: array, items: { $ref: "#/components/schemas/ConsentInput" } }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    Tokens:
      type: object
      required: [access, refresh, access_expires_at]
      properties:
        access: { type: string }
        refresh: { type: string }
        access_expires_at: { type: string, format: date-time }
    AuthResult:
      type: object
      required: [tokens, me, created]
      properties:
        tokens: { $ref: "#/components/schemas/Tokens" }
        me: { $ref: "#/components/schemas/Me" }
        created: { type: boolean }
        invite_code_status: { type: string, enum: [none, valid, invalid] }
    Targets:
      type: object
      required: [kcal, protein_g, carbs_g, fat_g, fiber_g, salt_max_g, water_ml]
      properties:
        kcal: { type: integer }
        protein_g: { type: integer }
        carbs_g: { type: integer }
        fat_g: { type: integer }
        fiber_g: { type: integer }
        salt_max_g: { type: number }
        water_ml: { type: integer }
        bmr_kcal: { type: integer }
        valid_from: { type: string, format: date }
        warning: { type: [string, "null"], description: "Ex. cible contradictoire avec l'objectif (texte traduit)" }
    Entitlements:
      type: object
      description: Droits effectifs calculés par l'API — le mobile n'en déduit rien d'autre
      required: [tier, features]
      properties:
        tier: { $ref: "#/components/schemas/PlanTier" }
        trial_ends_at: { type: [string, "null"], format: date-time }
        plus_until: { type: [string, "null"], format: date-time }
        features:
          type: object
          description: "Clé = feature, valeur = autorisée"
          additionalProperties: { type: boolean }
          examples: [{ text_analysis: false, progress_long_range: false, programs: false, insights: false, offline_workouts: false, streak_freeze: false }]
    Me:
      type: object
      required: [id, email, email_verified, locale, profile, targets, entitlements, preferences]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        has_password: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        created_at: { type: string, format: date-time }
        profile:
          type: object
          required: [first_name, last_name, sex, height_cm, current_weight_kg, target_weight_kg, goals]
          properties:
            first_name: { type: string }
            last_name: { type: string }
            initials: { type: string }
            avatar: { anyOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
            birth_date: { type: string, format: date }
            age: { type: integer }
            sex: { $ref: "#/components/schemas/Sex" }
            city: { anyOf: [{ $ref: "#/components/schemas/City" }, { type: "null" }] }
            city_label: { type: [string, "null"] }
            height_cm: { type: number }
            current_weight_kg: { type: number }
            target_weight_kg: { type: number }
            goals: { type: array, items: { $ref: "#/components/schemas/Goal" } }
            activity_adjustment: { type: boolean }
            timezone: { type: string }
        targets: { $ref: "#/components/schemas/Targets" }
        entitlements: { $ref: "#/components/schemas/Entitlements" }
        preferences:
          type: object
          properties:
            theme: { type: string, enum: [system, light, dark] }
            unit_weight: { type: string, enum: [kg, lb] }
            unit_height: { type: string, enum: [cm, ft] }
            unit_volume: { type: string, enum: [cl, oz] }
        pending_documents: { type: array, items: { $ref: "#/components/schemas/LegalDocumentRef" } }
        rewards_summary: { $ref: "#/components/schemas/RewardsSummary" }
    ProfileUpdate:
      type: object
      minProperties: 1
      properties:
        first_name: { type: string, maxLength: 40 }
        last_name: { type: string, maxLength: 40 }
        birth_date: { type: string, format: date }
        sex: { $ref: "#/components/schemas/Sex" }
        city_id: { type: [string, "null"], format: uuid }
        city_label: { type: [string, "null"], maxLength: 80 }
        height_cm: { type: number, minimum: 100, maximum: 250 }
        target_weight_kg: { type: number, minimum: 30, maximum: 300 }
        goals: { type: array, items: { $ref: "#/components/schemas/Goal" }, minItems: 1 }
        activity_adjustment: { type: boolean }
        locale: { $ref: "#/components/schemas/Locale" }
        theme: { type: string, enum: [system, light, dark] }
        unit_weight: { type: string, enum: [kg, lb] }
        unit_height: { type: string, enum: [cm, ft] }
        unit_volume: { type: string, enum: [cl, oz] }
    Session:
      type: object
      required: [id, device_name, platform, last_used_at, current]
      properties:
        id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { type: string }
        app_version: { type: string }
        city: { type: [string, "null"] }
        last_used_at: { type: string, format: date-time }
        current: { type: boolean }
    LegalDocumentRef:
      type: object
      required: [kind, version, title]
      properties:
        kind: { $ref: "#/components/schemas/LegalKind" }
        version: { type: integer }
        title: { type: string }
    LegalDocument:
      allOf:
        - $ref: "#/components/schemas/LegalDocumentRef"
        - type: object
          required: [body, published_at]
          properties:
            body: { type: string, description: Markdown }
            published_at: { type: string, format: date-time }
    ConsentState:
      type: object
      required: [kind, granted, updated_at]
      properties:
        kind: { $ref: "#/components/schemas/ConsentKind" }
        granted: { type: boolean }
        version: { type: [integer, "null"] }
        updated_at: { type: string, format: date-time }
        withdrawable: { type: boolean, description: "false pour CGU / confidentialité (retrait = suppression du compte)" }
    DataExport:
      type: object
      required: [id, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, ready, expired] }
        requested_at: { type: string, format: date-time }
        download_url: { type: [string, "null"], format: uri }
        expires_at: { type: [string, "null"], format: date-time }
    UploadTicket:
      type: object
      required: [id, upload_url, method, headers, expires_at]
      properties:
        id: { type: string, format: uuid }
        upload_url: { type: string, format: uri }
        method: { type: string, const: PUT }
        headers: { type: object, additionalProperties: { type: string } }
        expires_at: { type: string, format: date-time }

    # ───────── Accueil / journal
    WeekDay:
      type: object
      required: [date, label, is_today, status]
      properties:
        date: { type: string, format: date }
        label: { type: string, examples: [Lun] }
        day_number: { type: integer }
        is_today: { type: boolean }
        status: { type: string, enum: [empty, partial, on_target, over, under, future] }
    DaySummary:
      type: object
      description: Résumé recalculé d'un jour (renvoyé après chaque écriture)
      required: [date, kcal, protein, carbs, fat, water]
      properties:
        date: { type: string, format: date }
        kcal: { $ref: "#/components/schemas/Gauge" }
        protein: { $ref: "#/components/schemas/Gauge" }
        carbs: { $ref: "#/components/schemas/Gauge" }
        fat: { $ref: "#/components/schemas/Gauge" }
        fiber: { $ref: "#/components/schemas/Gauge" }
        salt: { $ref: "#/components/schemas/Gauge" }
        water: { $ref: "#/components/schemas/Gauge" }
        target_adjusted_by_activity_kcal: { type: integer }
        balance: { anyOf: [{ $ref: "#/components/schemas/Balance" }, { type: "null" }] }
        meals_count: { type: integer }
    Balance:
      type: object
      required: [consumed_kcal, burned_kcal, difference_kcal, status]
      properties:
        consumed_kcal: { type: integer }
        burned_kcal: { type: integer }
        difference_kcal: { type: integer }
        status: { type: string, enum: [deficit, balanced, surplus] }
        label: { type: string, description: Texte traduit }
    Water:
      type: object
      required: [date, gauge, quick_add_ml]
      properties:
        date: { type: string, format: date }
        gauge: { $ref: "#/components/schemas/Gauge" }
        quick_add_ml: { type: array, items: { type: integer }, examples: [[250, 500]] }
    Home:
      type: object
      required: [greeting, date, week, day, quick_actions, shortcuts, rewards]
      properties:
        greeting: { type: string, examples: ["Bonjour, Awa"] }
        date: { type: string, format: date }
        week: { type: array, items: { $ref: "#/components/schemas/WeekDay" }, minItems: 7, maxItems: 7 }
        day: { $ref: "#/components/schemas/DaySummary" }
        quick_actions:
          type: array
          items:
            type: object
            required: [kind, enabled]
            properties:
              kind: { type: string, enum: [photo, voice, catalog] }
              enabled: { type: boolean }
              locked_reason: { type: [string, "null"], enum: [plan_required, quota_exceeded, null] }
              remaining: { type: [integer, "null"] }
        active_program: { anyOf: [{ $ref: "#/components/schemas/ProgramToday" }, { type: "null" }] }
        active_challenges: { type: array, items: { $ref: "#/components/schemas/ChallengeToday" } }
        shortcuts: { type: array, items: { type: string, enum: [nutrition, sport, recipes, plants] } }
        rewards: { $ref: "#/components/schemas/RewardsSummary" }
        insight: { anyOf: [{ $ref: "#/components/schemas/Insight" }, { type: "null" }] }
        tip: { anyOf: [{ $ref: "#/components/schemas/UserTip" }, { type: "null" }] }
        banners:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string, enum: [verify_email, trial_ending, reaccept_terms, connect_health, quota_low] }
              message: { type: string }
              action: { type: string }
    DayDetail:
      type: object
      required: [day, meals_by_type, water, message]
      properties:
        day: { $ref: "#/components/schemas/DaySummary" }
        meals_by_type:
          type: array
          items:
            type: object
            required: [meal_type, label, kcal, meals]
            properties:
              meal_type: { $ref: "#/components/schemas/MealType" }
              label: { type: string }
              kcal: { type: integer }
              meals: { type: array, items: { $ref: "#/components/schemas/Meal" } }
        water: { $ref: "#/components/schemas/Water" }
        message: { type: string, description: Encouragement adapté à la journée }
        previous_date: { type: string, format: date }
        next_date: { type: [string, "null"], format: date }

    # ───────── Repas / analyses
    Quota:
      type: object
      required: [feature, limit, used, remaining, period]
      properties:
        feature: { type: string, enum: [photo_analysis, text_analysis, challenges_active] }
        limit: { type: [integer, "null"] }
        used: { type: integer }
        remaining: { type: [integer, "null"] }
        period: { type: string, enum: [day, month, trial] }
        resets_at: { type: [string, "null"], format: date-time }
    AnalysisItem:
      type: object
      required: [food_id, label, grams]
      properties:
        food_id: { type: string, format: uuid }
        label: { type: string }
        grams: { type: number }
        confidence: { type: number }
        nutrients: { $ref: "#/components/schemas/Nutrients" }
    Analysis:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [photo, text] }
        status: { type: string, enum: [queued, processing, succeeded, failed] }
        failure_reason: { type: [string, "null"], enum: [blurry, no_food, unsupported, provider_error, timeout, null] }
        failure_message: { type: [string, "null"] }
        photo: { anyOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
        dish: { anyOf: [{ $ref: "#/components/schemas/DishSummary" }, { type: "null" }] }
        dish_label: { type: [string, "null"] }
        confidence: { type: [number, "null"] }
        low_confidence: { type: boolean }
        alternatives:
          type: array
          maxItems: 3
          description: Autres plats envisagés, par probabilité décroissante (rubrique « Pas satisfait ? »)
          items: { $ref: "#/components/schemas/AnalysisAlternative" }
        items: { type: array, items: { $ref: "#/components/schemas/AnalysisItem" } }
        totals: { $ref: "#/components/schemas/Nutrients" }
        suggested_meal_type: { $ref: "#/components/schemas/MealType" }
        suggested_recipe_id: { type: [string, "null"], format: uuid }
        quota: { $ref: "#/components/schemas/Quota" }
        created_at: { type: string, format: date-time }
    PhotoAnalysisInput:
      type: object
      required: [kind, upload_id]
      properties:
        kind: { type: string, const: photo }
        upload_id: { type: string, format: uuid }
    TextAnalysisInput:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, const: text }
        text: { type: string, minLength: 3, maxLength: 500 }
    GooglePlayPurchaseInput:
      type: object
      required: [channel, product_id, purchase_token]
      properties:
        channel: { type: string, const: google_play }
        product_id: { type: string }
        purchase_token: { type: string }
    AppStorePurchaseInput:
      type: object
      required: [channel, signed_transaction]
      properties:
        channel: { type: string, const: app_store }
        signed_transaction: { type: string, description: JWS StoreKit 2 }
    AnalysisAlternative:
      type: object
      required: [label, dish, probability_percent]
      properties:
        label: { type: string }
        dish:
          description: Plat du catalogue correspondant, null s'il est absent (la recherche est alors pré-remplie avec label)
          anyOf: [{ $ref: "#/components/schemas/DishSummary" }, { type: "null" }]
        probability_percent: { type: integer, minimum: 0, maximum: 100, description: Arrondie par l'API }
    FeedbackInput:
      type: object
      required: [rating]
      properties:
        rating: { type: string, enum: [up, down] }
        reason: { $ref: "#/components/schemas/FeedbackReason" }
        corrected_dish_label:
          type: string
          maxLength: 80
          description: Plat réel selon l'utilisateur, attendu quand reason = wrong_dish (nettoyé avant tout usage)
        comment: { type: string, maxLength: 1000 }
    MealItemInput:
      type: object
      required: [food_id, grams]
      properties:
        food_id: { type: string, format: uuid }
        grams: { type: number, exclusiveMinimum: 0, maximum: 3000 }
    MealInput:
      type: object
      required: [source, meal_type]
      properties:
        source: { type: string, enum: [photo, text, dish, recipe, foods, program] }
        meal_type: { $ref: "#/components/schemas/MealType" }
        date: { type: string, format: date }
        eaten_at: { type: string, format: date-time }
        analysis_id: { type: string, format: uuid, description: "source = photo|text" }
        dish_id: { type: string, format: uuid, description: "source = dish" }
        recipe_id: { type: string, format: uuid, description: "source = recipe|program" }
        portions: { type: number, minimum: 0.25, maximum: 10, description: "dish/recipe : multiple de la portion standard" }
        items: { type: array, items: { $ref: "#/components/schemas/MealItemInput" }, maxItems: 40, description: "Ingrédients validés (corrigés) — obligatoire pour photo|text|foods" }
        keep_photo: { type: boolean, default: true }
    MealUpdate:
      type: object
      minProperties: 1
      properties:
        meal_type: { $ref: "#/components/schemas/MealType" }
        date: { type: string, format: date }
        items: { type: array, items: { $ref: "#/components/schemas/MealItemInput" }, maxItems: 40 }
        portions: { type: number, minimum: 0.25, maximum: 10 }
    Meal:
      type: object
      required: [id, date, meal_type, source, title, nutrients, items, created_at]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        eaten_at: { type: string, format: date-time }
        meal_type: { $ref: "#/components/schemas/MealType" }
        source: { type: string }
        title: { type: string }
        photo: { anyOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
        nutrients: { $ref: "#/components/schemas/Nutrients" }
        items: { type: array, items: { $ref: "#/components/schemas/AnalysisItem" } }
        analysis_id: { type: [string, "null"], format: uuid }
        feedback_given: { type: boolean }
        created_at: { type: string, format: date-time }
    MealWriteResult:
      type: object
      required: [meal, day, rewards]
      properties:
        meal: { $ref: "#/components/schemas/Meal" }
        day: { $ref: "#/components/schemas/DaySummary" }
        previous_day: { anyOf: [{ $ref: "#/components/schemas/DaySummary" }, { type: "null" }], description: "Si le repas a changé de jour" }
        rewards: { $ref: "#/components/schemas/RewardDelta" }

    # ───────── Catalogue
    FoodSummary:
      type: object
      required: [id, name, per_100g]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        matched_alias: { type: [string, "null"] }
        category: { type: string }
        default_portion_g: { type: [number, "null"] }
        per_100g: { $ref: "#/components/schemas/Nutrients" }
    DishSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        image: { anyOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
        standard_portion_g: { type: number }
        kcal_per_portion: { type: integer }
        is_favorite: { type: boolean }
    DishDetail:
      allOf:
        - $ref: "#/components/schemas/DishSummary"
        - type: object
          properties:
            aliases: { type: array, items: { type: string } }
            components: { type: array, items: { $ref: "#/components/schemas/AnalysisItem" } }
            nutrients_per_portion: { $ref: "#/components/schemas/Nutrients" }
            recipe_id: { type: [string, "null"], format: uuid }

    # ───────── Suivi
    Progress:
      type: object
      required: [metric, range, unit, today, series, summary_last_7]
      properties:
        metric: { type: string }
        range: { type: string }
        unit: { type: string, enum: [kcal, g] }
        today: { type: number }
        delta_vs_yesterday: { type: number }
        delta_percent: { type: [integer, "null"] }
        target: { type: [number, "null"] }
        average: { type: number }
        empty: { type: boolean, description: "Aucun repas encore : afficher l'illustration" }
        series:
          type: array
          items:
            type: object
            required: [date, value]
            properties:
              date: { type: string, format: date }
              value: { type: [number, "null"] }
              status: { type: string, enum: [under, on_target, over, empty] }
        summary_last_7:
          type: array
          items:
            type: object
            required: [date, kcal]
            properties:
              date: { type: string, format: date }
              kcal: { type: integer }
              status: { type: string }
        health: { $ref: "#/components/schemas/HealthConnection" }
    WeightOverview:
      type: object
      required: [current_kg, target_kg, remaining_kg, series]
      properties:
        current_kg: { type: [number, "null"] }
        target_kg: { type: number }
        remaining_kg: { type: [number, "null"] }
        start_kg: { type: [number, "null"] }
        trend: { type: string, enum: [down, stable, up, unknown] }
        trend_kg_per_week: { type: [number, "null"] }
        bmi: { type: [number, "null"] }
        series:
          type: array
          items:
            type: object
            required: [id, date, weight_kg, source]
            properties:
              id: { type: string, format: uuid }
              date: { type: string, format: date }
              weight_kg: { type: number }
              source: { type: string, enum: [manual, health_connect, apple_health] }
        next_reminder: { type: [string, "null"], format: date }

    # ───────── Activité
    HealthConnection:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        source: { type: [string, "null"], enum: [health_connect, apple_health, null] }
        granted_types: { type: array, items: { type: string } }
        read_types_label: { type: string, description: "« Données lues : pas, calories, … »" }
        last_sync_at: { type: [string, "null"], format: date-time }
    HealthSyncInput:
      type: object
      required: [source, days]
      properties:
        source: { type: string, enum: [health_connect, apple_health] }
        days:
          type: array
          maxItems: 31
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
              steps: { type: integer, minimum: 0, maximum: 200000 }
              distance_m: { type: integer, minimum: 0 }
              active_kcal: { type: integer, minimum: 0, maximum: 20000 }
              total_burned_kcal: { type: integer, minimum: 0 }
        workouts:
          type: array
          maxItems: 200
          items:
            type: object
            required: [external_id, type, started_at, duration_s]
            properties:
              external_id: { type: string, maxLength: 128 }
              type: { type: string }
              started_at: { type: string, format: date-time }
              duration_s: { type: integer, minimum: 1 }
              kcal: { type: integer, minimum: 0 }
              distance_m: { type: integer }
              avg_hr: { type: integer }
        weights:
          type: array
          maxItems: 100
          items:
            type: object
            required: [measured_at, weight_kg]
            properties:
              measured_at: { type: string, format: date-time }
              weight_kg: { type: number, minimum: 30, maximum: 300 }
    MergeSuggestion:
      type: object
      required: [manual_id, imported_id]
      properties:
        manual_id: { type: string, format: uuid }
        imported_id: { type: string, format: uuid }
        message: { type: string }
    ActivityInput:
      type: object
      required: [type, duration_s, intensity]
      properties:
        type: { type: string, enum: [walking, running, football, dancing, cycling, strength, swimming, other] }
        duration_s: { type: integer, minimum: 60, maximum: 43200 }
        intensity: { type: string, enum: [light, moderate, vigorous] }
        started_at: { type: string, format: date-time }
        date: { type: string, format: date }
        label: { type: string, maxLength: 60 }
    Activity:
      type: object
      required: [id, date, type, duration_s, kcal, source, editable]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        type: { type: string }
        label: { type: string }
        started_at: { type: string, format: date-time }
        duration_s: { type: integer }
        intensity: { type: [string, "null"] }
        kcal: { type: integer }
        distance_m: { type: [integer, "null"] }
        avg_hr: { type: [integer, "null"] }
        source: { type: string, enum: [manual, health_connect, apple_health, workout] }
        editable: { type: boolean }
    ActivityWriteResult:
      type: object
      required: [activity, day, rewards]
      properties:
        activity: { $ref: "#/components/schemas/Activity" }
        day: { $ref: "#/components/schemas/DaySummary" }
        merge_suggestion: { anyOf: [{ $ref: "#/components/schemas/MergeSuggestion" }, { type: "null" }] }
        rewards: { $ref: "#/components/schemas/RewardDelta" }
    ActivityOverview:
      type: object
      required: [date, steps, health, balance_day, balance_week, activities]
      properties:
        date: { type: string, format: date }
        steps: { $ref: "#/components/schemas/Gauge" }
        distance_m: { type: integer }
        active_kcal: { type: integer }
        active_minutes: { type: integer }
        health: { $ref: "#/components/schemas/HealthConnection" }
        balance_day: { $ref: "#/components/schemas/Balance" }
        balance_week:
          type: array
          items:
            type: object
            required: [date, consumed_kcal, burned_kcal]
            properties:
              date: { type: string, format: date }
              consumed_kcal: { type: integer }
              burned_kcal: { type: integer }
        activities: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        recommended_workouts: { type: array, items: { $ref: "#/components/schemas/WorkoutSummary" } }
    Insight:
      type: object
      required: [id, week_start, message]
      properties:
        id: { type: string, format: uuid }
        week_start: { type: string, format: date }
        kind: { type: string }
        message: { type: string }
        data: { type: object, additionalProperties: true }

    # ───────── Entraînement
    Media:
      type: object
      required: [hls_url]
      properties:
        hls_url: { type: string, format: uri }
        poster: { $ref: "#/components/schemas/Image" }
        duration_s: { type: integer }
        subtitles: { type: array, items: { type: object, properties: { locale: { $ref: "#/components/schemas/Locale" }, url: { type: string, format: uri } } } }
    ExerciseSummary:
      type: object
      required: [id, name, level, locked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        thumbnail: { $ref: "#/components/schemas/Image" }
        muscles: { type: array, items: { type: string } }
        level: { $ref: "#/components/schemas/Level" }
        equipment: { type: array, items: { type: string } }
        locked: { type: boolean }
    ExerciseDetail:
      allOf:
        - $ref: "#/components/schemas/ExerciseSummary"
        - type: object
          required: [instructions, video]
          properties:
            instructions: { type: string }
            video: { $ref: "#/components/schemas/Media" }
    WorkoutSummary:
      type: object
      required: [id, name, goal, level, duration_s, locked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        goal: { type: string, enum: [cardio, strength, mobility] }
        level: { $ref: "#/components/schemas/Level" }
        duration_s: { type: integer }
        exercises_count: { type: integer }
        estimated_kcal: { type: integer }
        cover: { $ref: "#/components/schemas/Image" }
        locked: { type: boolean }
    WorkoutDetail:
      allOf:
        - $ref: "#/components/schemas/WorkoutSummary"
        - type: object
          required: [steps]
          properties:
            description: { type: string }
            downloadable: { type: boolean }
            steps:
              type: array
              items:
                type: object
                required: [order, exercise, mode, rest_s]
                properties:
                  order: { type: integer }
                  exercise: { $ref: "#/components/schemas/ExerciseDetail" }
                  mode: { type: string, enum: [time, reps] }
                  duration_s: { type: [integer, "null"] }
                  reps: { type: [integer, "null"] }
                  rest_s: { type: integer }

    # ───────── Programmes / challenges
    ProgramSummary:
      type: object
      required: [id, name, goal, weeks, locked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        goal: { $ref: "#/components/schemas/Goal" }
        weeks: { type: integer }
        cover: { $ref: "#/components/schemas/Image" }
        locked: { type: boolean }
        is_active: { type: boolean }
    ProgramDayView:
      type: object
      required: [day_index, date, tasks]
      properties:
        day_index: { type: integer }
        date: { type: string, format: date }
        tip: { type: [string, "null"] }
        workout: { anyOf: [{ $ref: "#/components/schemas/WorkoutSummary" }, { type: "null" }] }
        suggested_recipes: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
        tasks:
          type: array
          items:
            type: object
            required: [id, label, done, validation]
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              done: { type: boolean }
              validation: { type: string, enum: [auto, manual] }
              progress: { type: [number, "null"], description: "0-1 pour les tâches automatiques" }
        status: { type: string, enum: [done, partial, missed, today, upcoming] }
    ProgramDetail:
      allOf:
        - $ref: "#/components/schemas/ProgramSummary"
        - type: object
          properties:
            days_preview: { type: array, items: { $ref: "#/components/schemas/ProgramDayView" } }
            rewards: { type: object, properties: { points: { type: integer }, badge: { $ref: "#/components/schemas/BadgeRef" } } }
    ProgramToday:
      type: object
      required: [enrollment_id, program_name, day_index, total_days, percent]
      properties:
        enrollment_id: { type: string, format: uuid }
        program_name: { type: string }
        day_index: { type: integer }
        total_days: { type: integer }
        percent: { type: integer }
        tasks_done: { type: integer }
        tasks_total: { type: integer }
    Enrollment:
      type: object
      required: [id, program, status, started_on, day_index, percent, today, week]
      properties:
        id: { type: string, format: uuid }
        program: { $ref: "#/components/schemas/ProgramSummary" }
        status: { type: string, enum: [active, completed, abandoned, replaced] }
        started_on: { type: string, format: date }
        day_index: { type: integer }
        percent: { type: integer }
        assiduity_percent: { type: integer }
        today: { $ref: "#/components/schemas/ProgramDayView" }
        week: { type: array, items: { $ref: "#/components/schemas/ProgramDayView" } }
        report: { type: [object, "null"], description: "Bilan final (poids, assiduité) si terminé" }
    ChallengeSummary:
      type: object
      required: [id, name, duration_days, rule_label, validation]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        duration_days: { type: integer }
        rule_label: { type: string, examples: ["Boire 2 L d'eau"] }
        validation: { type: string, enum: [auto, manual] }
        success_threshold_percent: { type: integer }
        points: { type: integer }
        badge: { $ref: "#/components/schemas/BadgeRef" }
        cover: { $ref: "#/components/schemas/Image" }
        joined: { type: boolean }
    ChallengeToday:
      type: object
      required: [participation_id, name, day_index, duration_days, today_status]
      properties:
        participation_id: { type: string, format: uuid }
        name: { type: string }
        day_index: { type: integer }
        duration_days: { type: integer }
        today_status: { type: string, enum: [pending, success, failed] }
        today_progress: { type: [number, "null"] }
        today_label: { type: string, examples: ["1,4 L sur 2 L"] }
        can_check: { type: boolean }
    Participation:
      type: object
      required: [id, challenge, status, started_on, success_rate_percent, streak, days]
      properties:
        id: { type: string, format: uuid }
        challenge: { $ref: "#/components/schemas/ChallengeSummary" }
        status: { type: string, enum: [active, succeeded, failed, abandoned] }
        started_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        success_rate_percent: { type: integer }
        streak: { type: integer }
        today: { $ref: "#/components/schemas/ChallengeToday" }
        days:
          type: array
          items:
            type: object
            required: [date, status]
            properties:
              date: { type: string, format: date }
              status: { type: string, enum: [pending, success, failed, upcoming] }

    # ───────── Récompenses
    LevelInfo:
      type: object
      required: [rank, name]
      properties:
        rank: { type: integer }
        name: { type: string }
        icon: { $ref: "#/components/schemas/Image" }
        min_points: { type: integer }
    BadgeRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        icon: { $ref: "#/components/schemas/Image" }
    RewardsSummary:
      type: object
      required: [level, total_points, streak]
      properties:
        level: { $ref: "#/components/schemas/LevelInfo" }
        total_points: { type: integer }
        streak: { type: integer }
        progress_to_next_percent: { type: integer }
    RewardsOverview:
      type: object
      required: [level, next_level, total_points, points_to_next, progress_percent, week_points, streak, best_streak, badges_earned, badges_next]
      properties:
        level: { $ref: "#/components/schemas/LevelInfo" }
        next_level: { anyOf: [{ $ref: "#/components/schemas/LevelInfo" }, { type: "null" }] }
        total_points: { type: integer }
        points_to_next: { type: integer }
        progress_percent: { type: integer }
        week_points: { type: integer }
        streak: { type: integer }
        best_streak: { type: integer }
        streak_freeze_available: { type: boolean }
        badges_earned: { type: array, items: { $ref: "#/components/schemas/UserBadge" } }
        badges_next: { type: array, items: { $ref: "#/components/schemas/UserBadge" } }
    UserBadge:
      type: object
      required: [badge, family, state, progress_percent]
      properties:
        badge: { $ref: "#/components/schemas/BadgeRef" }
        family: { type: string }
        description: { type: string }
        state: { type: string, enum: [locked, in_progress, earned] }
        progress_percent: { type: integer }
        progress_label: { type: string, examples: ["4 / 7 jours"] }
        earned_at: { type: [string, "null"], format: date-time }
    PointEvent:
      type: object
      required: [id, label, points, date]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        label: { type: string }
        points: { type: integer }
        date: { type: string, format: date }

    # ───────── Contenus
    RecipeSummary:
      type: object
      required: [id, name, total_minutes, locked]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        image: { $ref: "#/components/schemas/Image" }
        total_minutes: { type: integer }
        difficulty: { type: string, enum: [easy, medium, hard] }
        kcal_per_serving: { type: integer }
        tags: { type: array, items: { type: string } }
        tag_labels: { type: array, items: { type: string } }
        is_favorite: { type: boolean }
        locked: { type: boolean }
    RecipeDetail:
      allOf:
        - $ref: "#/components/schemas/RecipeSummary"
        - type: object
          required: [servings, ingredients, steps, nutrients_per_serving]
          properties:
            description: { type: string }
            prep_minutes: { type: integer }
            cook_minutes: { type: integer }
            servings: { type: integer }
            ingredients: { type: array, items: { type: object, required: [label], properties: { label: { type: string }, food_id: { type: string, format: uuid }, grams: { type: number } } } }
            steps: { type: array, items: { type: object, required: [order, text], properties: { order: { type: integer }, text: { type: string }, image: { $ref: "#/components/schemas/Image" } } } }
            nutrients_per_serving: { $ref: "#/components/schemas/Nutrients" }
            related_plants: { type: array, items: { $ref: "#/components/schemas/PlantSummary" } }
    PlantSummary:
      type: object
      required: [id, common_name, scientific_name]
      properties:
        id: { type: string, format: uuid }
        common_name: { type: string }
        scientific_name: { type: string }
        image: { $ref: "#/components/schemas/Image" }
        tags: { type: array, items: { type: string } }
        is_favorite: { type: boolean }
    PlantDetail:
      allOf:
        - $ref: "#/components/schemas/PlantSummary"
        - type: object
          required: [traditional_use, nutritional_benefits, precautions, disclaimer]
          properties:
            traditional_use: { type: string }
            nutritional_benefits: { type: string }
            precautions: { type: string }
            contraindications: { type: array, items: { type: object, properties: { code: { type: string }, label: { type: string } } } }
            disclaimer: { type: string }
            related_recipes: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
    UserTip:
      type: object
      required: [id, topic, title, body, tier]
      properties:
        id: { type: string, format: uuid }
        topic: { type: string }
        title: { type: string }
        body: { type: string }
        tier: { type: string, enum: [free, plus] }
        locked: { type: boolean }
        triggered_on: { type: string, format: date }
        related_recipes: { type: array, items: { $ref: "#/components/schemas/RecipeSummary" } }
        related_plants: { type: array, items: { $ref: "#/components/schemas/PlantSummary" } }
        read: { type: boolean }
    PreventionOverview:
      type: object
      required: [state, tips]
      properties:
        state: { type: string, enum: [not_enough_data, ok] }
        tips: { type: array, items: { $ref: "#/components/schemas/UserTip" } }
        weekly_report: { type: [object, "null"], additionalProperties: true, description: Plus uniquement }
        weekly_report_locked: { type: boolean }

    # ───────── Abonnement / parrainage
    PlanCatalog:
      type: object
      required: [plans, comparison]
      properties:
        plans:
          type: array
          items:
            type: object
            required: [code, name, price, interval, featured]
            properties:
              code: { type: string }
              name: { type: string }
              price: { $ref: "#/components/schemas/Money" }
              monthly_equivalent: { $ref: "#/components/schemas/Money" }
              savings_percent: { type: [integer, "null"] }
              interval: { type: string, enum: [month, year, none] }
              featured: { type: boolean }
              store_product_ids: { type: object, properties: { google: { type: string }, apple: { type: string } } }
        comparison:
          type: array
          items:
            type: object
            required: [feature, label, free, plus]
            properties:
              feature: { type: string }
              label: { type: string }
              trial: { type: string }
              free: { type: string }
              plus: { type: string }
    SubscriptionState:
      type: object
      required: [entitlements, quotas, can_purchase_in_app, can_manage]
      properties:
        entitlements: { $ref: "#/components/schemas/Entitlements" }
        subscription:
          anyOf:
            - type: object
              required: [plan_code, channel, status, current_period_end, auto_renew]
              properties:
                plan_code: { type: string }
                plan_name: { type: string }
                channel: { $ref: "#/components/schemas/Channel" }
                status: { $ref: "#/components/schemas/SubscriptionStatus" }
                current_period_end: { type: string, format: date-time }
                auto_renew: { type: boolean }
                price: { $ref: "#/components/schemas/Money" }
            - type: "null"
        trial_days_left: { type: [integer, "null"] }
        granted_days_left: { type: [integer, "null"] }
        quotas: { type: array, items: { $ref: "#/components/schemas/Quota" } }
        can_purchase_in_app: { type: boolean }
        can_manage: { type: string, enum: [store, web, none] }
        web_checkout_allowed: { type: boolean, description: Pays autorisé à renvoyer vers le site }
    Payment:
      type: object
      required: [id, channel, amount, status, paid_at]
      properties:
        id: { type: string, format: uuid }
        channel: { $ref: "#/components/schemas/Channel" }
        description: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [succeeded, failed, refunded, pending] }
        paid_at: { type: string, format: date-time }
        receipt_url: { type: [string, "null"], format: uri }
    ReferralOverview:
      type: object
      required: [code, share_url, share_message, validated_count, days_earned, days_cap]
      properties:
        code: { type: string }
        share_url: { type: string, format: uri }
        share_message: { type: string }
        validated_count: { type: integer }
        pending_count: { type: integer }
        days_earned: { type: integer }
        days_cap: { type: integer, examples: [35] }
        referees: { type: array, items: { type: object, properties: { first_name: { type: string }, status: { type: string, enum: [pending, validated, rejected] }, date: { type: string, format: date } } } }

    # ───────── Notifications / support
    NotificationPreferences:
      type: object
      required: [categories, quiet_start, quiet_end]
      properties:
        categories:
          type: object
          properties:
            meal_reminders: { type: boolean }
            hydration: { type: boolean }
            weigh_in: { type: boolean }
            programs_challenges: { type: boolean }
            rewards: { type: boolean }
            prevention: { type: boolean }
            campaigns: { type: boolean, description: Lié au consentement marketing }
            subscription: { type: boolean, const: true, readOnly: true }
        meal_reminder_times:
          type: object
          properties:
            breakfast: { type: string, pattern: "^\\d{2}:\\d{2}$" }
            lunch: { type: string, pattern: "^\\d{2}:\\d{2}$" }
            dinner: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        weigh_in_weekday: { type: integer, minimum: 1, maximum: 7 }
        quiet_start: { type: string, pattern: "^\\d{2}:\\d{2}$" }
        quiet_end: { type: string, pattern: "^\\d{2}:\\d{2}$" }
    Notification:
      type: object
      required: [id, category, title, body, created_at, read]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        deeplink: { type: [string, "null"] }
        image: { anyOf: [{ $ref: "#/components/schemas/Image" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        read: { type: boolean }
    TicketInput:
      type: object
      required: [category, subject, message]
      properties:
        category: { $ref: "#/components/schemas/TicketCategory" }
        subject: { type: string, minLength: 3, maxLength: 120 }
        message: { type: string, minLength: 10, maxLength: 5000 }
        email: { type: string, format: email, description: "Requis sans authentification" }
        name: { type: string, maxLength: 80 }
        attachment_ids: { type: array, items: { type: string, format: uuid }, maxItems: 3 }
        captcha: { type: string, description: "Requis sans authentification" }
        meta: { type: object, properties: { app_version: { type: string }, os: { type: string }, device: { type: string } } }
    TicketSummary:
      type: object
      required: [id, number, subject, status, updated_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: string }
        subject: { type: string }
        category: { $ref: "#/components/schemas/TicketCategory" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        has_unread_reply: { type: boolean }
        updated_at: { type: string, format: date-time }
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/TicketSummary"
        - type: object
          required: [messages]
          properties:
            email: { type: string }
            user_id: { type: [string, "null"], format: uuid }
            assignee: { type: [string, "null"] }
            priority: { type: string }
            meta: { type: object, additionalProperties: true }
            messages:
              type: array
              items:
                type: object
                required: [id, direction, body, created_at]
                properties:
                  id: { type: string, format: uuid }
                  direction: { type: string, enum: [inbound, outbound, internal_note] }
                  author: { type: [string, "null"] }
                  body: { type: string }
                  attachments: { type: array, items: { $ref: "#/components/schemas/Image" } }
                  created_at: { type: string, format: date-time }

    # ───────── Admin
    StaffMember:
      type: object
