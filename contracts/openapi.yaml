            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Utilisateurs
  /admin/users:
    get:
      tags: [admin-users]
      operationId: adminListUsers
      summary: Liste des utilisateurs
      x-permission: users.view
      parameters:
        - { name: q, in: query, schema: { type: string, description: "email, nom ou id" } }
        - { name: plan, in: query, schema: { $ref: "#/components/schemas/PlanTier" } }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, deletion_pending] } }
        - { name: country, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/Ordering" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: "#/components/schemas/AdminUserRow" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/users/{id}:
    get:
      tags: [admin-users]
      operationId: adminGetUser
      x-permission: users.view
      summary: Fiche utilisateur (données santé masquées)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/users/{id}/health:
    get:
      tags: [admin-users]
      operationId: adminRevealUserHealth
      x-permission: users.view_health
      x-step-up: true
      summary: Révèle les données de santé (consultation journalisée, motif obligatoire)
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: reason, in: query, required: true, schema: { type: string, minLength: 5, maxLength: 200 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/users/{id}/actions:
    post:
      tags: [admin-users]
      operationId: adminUserAction
      x-permission: users.<action>
      x-access-note: "Permission = users.<action> (ex. users.suspend). Step-up pour suspend, reactivate, grant_plus_days, export_data, delete_data."
      summary: Action sur un compte (journalisée)
      description: |
        Rôles par action — support : resend_verification, send_password_reset, extend_trial ;
        finance : grant_plus_days, reset_quota ; superadmin : tout, dont suspend, reactivate, export_data, delete_data.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserActionInput" }
      responses:
        "200":
          description: Fiche à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── Contenus (CRUD générique typé — voir aussi x-content-types)
  /admin/content/{type}:
    get:
      tags: [admin-content]
      operationId: adminListContent
      summary: Liste des contenus d'un type
      x-permission: content.view
      parameters:
        - { $ref: "#/components/parameters/ContentType" }
        - { name: q, in: query, schema: { type: string } }
