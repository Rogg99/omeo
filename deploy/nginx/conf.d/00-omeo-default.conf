# Hôte inconnu ou accès direct par l'IP du VPS : aucune réponse.
# Seul default_server du serveur : aucun autre vhost ne doit porter ce mot-clé.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;  # aucun certificat envoyé : les domaines hébergés ne fuient pas
}
