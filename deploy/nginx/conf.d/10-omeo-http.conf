# Réglages communs (contexte http) des vhosts Omeo.

server_tokens off;

map $http_upgrade $omeo_connection_upgrade {
    default upgrade;
    ''      close;
}

# Limitation de débit par IP réelle (voir cloudflare-realip.conf)
limit_req_zone $binary_remote_addr zone=omeo_api:20m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=omeo_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=omeo_site:20m rate=30r/s;
limit_req_status 429;

# URL présignée S3 (SigV4 en query string) : seule façon d'atteindre directement un objet MinIO
map $args $omeo_s3_presigned {
    "~(^|&)X-Amz-Signature=[0-9a-f]{64}(&|$)" 1;
    default 0;
}
