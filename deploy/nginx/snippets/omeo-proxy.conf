# En-têtes transmis aux conteneurs. X-Forwarded-For est remplacé (pas complété) par l'IP réelle :
# un client ne peut pas y injecter de fausse adresse. Côté API : TRUSTED_PROXY_COUNT=1.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $omeo_connection_upgrade;
proxy_read_timeout 60s;
