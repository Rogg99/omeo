# Certificat d'origine Cloudflare (*.my-omeo.app et my-omeo.app), mode SSL « Full (strict) »
ssl_certificate     /etc/ssl/omeo/origin.pem;
ssl_certificate_key /etc/ssl/omeo/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:omeo_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
