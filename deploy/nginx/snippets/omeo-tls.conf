# Certificat Let's Encrypt (my-omeo.app et *.my-omeo.app, défi DNS-01 via l'API Cloudflare),
# obtenu et renouvelé par install.sh / certbot. Cloudflare en SSL « Full (strict) ».
ssl_certificate     /etc/letsencrypt/live/my-omeo.app/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/my-omeo.app/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:omeo_ssl:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
