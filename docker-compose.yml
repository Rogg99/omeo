# Services de développement local (base de données et file de tâches)
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: nyam
      POSTGRES_PASSWORD: nyam
      POSTGRES_DB: nyam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
