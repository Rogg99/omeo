# Reverse proxy de dev. Les sous-domaines *.localhost se résolvent sans toucher au fichier hosts.
#   http://localhost        -> web
#   http://admin.localhost  -> admin
#   http://api.localhost    -> api
#   tout autre hôte (10.0.2.2 depuis l'émulateur Android, IP du PC pour un vrai téléphone) -> api

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
client_max_body_size 20m;  # photos de repas

server {
    listen 80;
    server_name localhost;
    location / { proxy_pass http://web:3000; }
}

server {
    listen 80;
    server_name admin.localhost;
    location / { proxy_pass http://admin:3000; }
}

server {
    listen 80 default_server;
    server_name api.localhost;
    location / { proxy_pass http://api:8000; }
}
