<!DOCTYPE html>
<html lang="fr">
<head>

<body>
<script src="../shared/icons.js"></script>
<!-- Route réelle : /i/{code} — détecte la plateforme et redirige vers le bon store en conservant le code. -->
<main class="section" style="padding-top:48px;background:var(--sage-800);color:#f4efe6;border-radius:0 0 48px 48px">
  <div class="narrow center">
    <span class="ib glass" style="width:80px;height:80px;border-radius:24px;margin:0 auto" data-i="gift"></span>

    <div class="card mt32" style="background:#fffdf9;color:#151411;display:inline-flex;align-items:center;gap:20px;padding:18px 24px">
      <div style="text-align:start"><div class="xs faint" style="font-weight:600;letter-spacing:.1em">TON CODE</div><div style="font:600 32px var(--font-display);letter-spacing:.08em">AWA2026</div></div>
      <button class="btn sm ghost" data-i="copy"> Copier</button>
    </div>
    <div class="row wrapf mt32" style="justify-content:center" id="stores"></div>
    <p class="small mt24" style="color:#a9b3a0">Sur Android, le code est rempli automatiquement. Sur iPhone, saisis-le à la création du compte.</p>
  </div>
</main>
<section class="section tight">
  <div class="wrap grid g3" id="why"></div>
</section>
<script src="web.js"></script>
<script>
  const I = window.icon, B = window.brandIcons;
  stores.innerHTML = '<a class="store" href="#" style="background:#fffdf9;color:#151411">' + B.play + '<span><small>Disponible sur</small><b>Google Play</b></span></a><a class="store" href="#" style="background:#fffdf9;color:#151411">' + B.apple + '<span><small>Télécharger dans</small><b>l\'App Store</b></span></a>';
  why.innerHTML = [["camera", "Une photo suffit", "Le plat, les portions, les apports."], ["footprints", "Ton activité, automatiquement", "Pas et séances depuis ton téléphone."], ["book", "Des plats de chez nous", "Recettes et plantes locales."]].map((x) => '<div class="card"><span class="ib">' + I(x[0]) + '</span><h3 class="h3 mt16">' + x[1] + '</h3><p class="muted mt8">' + x[2] + "</p></div>").join("");
</script>
